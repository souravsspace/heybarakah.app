<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Radii</title>
    <style>
    @font-face {
      font-family: "Inter";
      src: url("../fonts/Inter.ttf") format("truetype");
      font-weight: 100 900;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      padding: 0;
      margin: 0;
      font-family: "Inter", sans-serif;
      color: #000;
      background: #fff;
    }
    body {
      padding: 28px 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
    }
    .cell {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .tile {
      width: 78px;
      height: 78px;
      background: #e8f0ea;
      border: 1.5px solid #29603e;
    }
    .name {
      font-size: 12px;
      font-weight: 600;
    }
    .spec {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      color: #6b7280;
    }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="cell">
        <div class="tile" style="border-radius:0"></div>
        <div class="name">none</div>
        <div class="spec">0px</div>
      </div>
      <div class="cell">
        <div class="tile" style="border-radius:4px"></div>
        <div class="name">sm</div>
        <div class="spec">4px</div>
      </div>
      <div class="cell">
        <div class="tile" style="border-radius:8px"></div>
        <div class="name">md</div>
        <div class="spec">8px</div>
      </div>
      <div class="cell">
        <div class="tile" style="border-radius:12px"></div>
        <div class="name">lg</div>
        <div class="spec">12px</div>
      </div>
      <div class="cell">
        <div class="tile" style="border-radius:16px"></div>
        <div class="name">xl · default</div>
        <div class="spec">16px</div>
      </div>
      <div class="cell">
        <div class="tile" style="border-radius:9999px"></div>
        <div class="name">full</div>
        <div class="spec">9999px</div>
      </div>
    </div>
  </body>
</html>
