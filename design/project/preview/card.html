<!doctype html>
<!-- @dsCard group="Brand" name="Card — outlined" subtitle="Default outlined card with eyebrow" viewport="700x280" -->
<html><head><meta charset="utf-8"><title>Card</title>
<style>
@font-face { font-family: "Inter"; src: url("../fonts/Inter-VariableFont_opsz_wght.ttf") format("truetype"); font-weight: 100 900; }
@font-face { font-family: "Libre Baskerville"; src: url("../fonts/LibreBaskerville-Bold.ttf") format("truetype"); font-weight: 700; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; font-family: "Inter", sans-serif; color: #000; }
body { padding: 28px 36px; display: flex; gap: 18px; }

.card { flex: 1; background: #fff; border: 1px solid #E5E7EB; border-radius: 16px; padding: 24px; }
.eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: #29603E; display:flex; align-items:center; gap: 10px; }
.eyebrow::before { content:""; display:inline-block; width:28px; height:1px; background:#29603E; }
.title { font-family: "Libre Baskerville", serif; font-weight: 700; font-size: 22px; line-height: 1.25; margin-top: 14px; }
.body { font-size: 14px; color: #6B7280; line-height: 1.5; margin-top: 8px; }
.divider { height: 1px; background: #EFEFEF; margin: 16px 0; }
.kv { display: flex; justify-content: space-between; font-size: 14px; }
.kv .v { color: #29603E; font-weight: 600; }
</style></head><body>
<div class="card">
  <div class="eyebrow">Daily adab</div>
  <div class="title">Eat with intention</div>
  <div class="body">Begin meals with gratitude and du'a.</div>
  <div class="divider"></div>
  <div class="kv"><span>Duration</span><span class="v">5 min</span></div>
</div>
<div class="card">
  <div class="eyebrow">Worldwide</div>
  <div class="title">12,847</div>
  <div class="body">Muslims praying with Barakah, this moment.</div>
  <div class="divider"></div>
  <div class="kv"><span>Growing</span><span class="v">every day</span></div>
</div>
</body></html>
