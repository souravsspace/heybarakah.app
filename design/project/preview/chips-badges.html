<!doctype html>
<!-- @dsCard group="Brand" name="Chips & badges" subtitle="Utility chips + promo badges" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Chips & badges</title>
<style>
@font-face { font-family: "Inter"; src: url("../fonts/Inter-VariableFont_opsz_wght.ttf") format("truetype"); font-weight: 100 900; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; font-family: "Inter", sans-serif; color: #000; }
body { padding: 28px 36px; display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.label { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color:#6B7280; }

.chip-neutral { background: #F5F5F4; color: #6B7280; font-size: 12px; padding: 6px 12px; border-radius: 9999px; }
.chip-soft    { background: #F5F5F4; color: #6B7280; font-size: 12px; padding: 6px 12px; border-radius: 9999px; }

.badge-trial  { background: #29603E; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; padding: 4px 10px; border-radius: 9999px; }
.badge-family { background: #0F1311; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; padding: 4px 10px; border-radius: 9999px; }
.badge-next   { background: #E8F0EA; color: #29603E; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; padding: 4px 10px; border-radius: 9999px; text-transform: uppercase; }
.badge-best   { background: #29603E; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; padding: 4px 10px; border-radius: 9999px; }
</style></head><body>
<div>
  <div class="label">Chips · utility (neutral-soft)</div>
  <div class="row" style="margin-top:8px"><span class="chip-neutral">T&Cs · Privacy</span><span class="chip-neutral">Subscribed?</span><span class="chip-neutral">Restore</span></div>
</div>
<div>
  <div class="label">Badges · promotional (use sparingly)</div>
  <div class="row" style="margin-top:8px">
    <span class="badge-trial">7 DAY FREE TRIAL</span>
    <span class="badge-best">BEST VALUE</span>
    <span class="badge-family">UP TO 5 MEMBERS</span>
    <span class="badge-next">NEXT</span>
  </div>
</div>
</body></html>
