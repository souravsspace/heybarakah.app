<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CTA & Link buttons</title>
    <style>
    @font-face {
      font-family: "Inter";
      src: url("../fonts/Inter.ttf") format("truetype");
      font-weight: 100 900;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      padding: 0;
      margin: 0;
      font-family: "Inter", sans-serif;
      color: #000;
      background: #fff;
    }
    body {
      padding: 32px 36px;
    }
    .label {
      margin-bottom: 10px;
      font-size: 10px;
      font-weight: 700;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
      margin-bottom: 22px;
    }

    .cta-uppercase {
      height: 64px;
      padding: 0 32px;
      font-family: "Inter";
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: #29603e;
      border: 0;
      border-radius: 16px;
    }
    .link-btn {
      font-family: "Inter";
      font-size: 14px;
      color: #6b7280;
      text-decoration: underline;
      background: transparent;
      border: 0;
    }
    .link-btn.strong {
      font-weight: 700;
      color: #000;
    }
    </style>
  </head>
  <body>
    <div class="label">All-caps CTA — yearly trial / paywall</div>
    <div class="row">
      <button class="cta-uppercase">Try for $0.00</button>
      <button class="cta-uppercase">Start monthly · $7.99/mo</button>
    </div>
    <div class="label">Link buttons — tertiary, underlined, sentence case</div>
    <div class="row">
      <button class="link-btn">Terms · Privacy</button>
      <button class="link-btn">Restore purchase</button>
      <button class="link-btn">
        Already subscribed? <span class="strong">Log In</span>
      </button>
    </div>
  </body>
</html>
