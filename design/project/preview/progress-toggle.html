<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Progress & toggle</title>
    <style>
    @font-face {
      font-family: "Inter";
      src: url("../fonts/Inter.ttf") format("truetype");
      font-weight: 100 900;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      padding: 0;
      margin: 0;
      font-family: "Inter", sans-serif;
      color: #000;
      background: #fff;
    }
    body {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 30px 36px;
    }
    .label {
      margin-bottom: 8px;
      font-size: 10px;
      font-weight: 700;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .bar {
      height: 6px;
      overflow: hidden;
      background: #e5e7eb;
      border-radius: 9999px;
    }
    .bar > .fill {
      height: 100%;
      background: #29603e;
    }
    .thin-bar {
      height: 2px;
      overflow: hidden;
      background: #efefef;
      border-radius: 9999px;
    }
    .thin-bar > .fill {
      height: 100%;
      background: #29603e;
    }

    .toggle-row {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 14px 20px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }
    .toggle-row .body {
      flex: 1;
    }
    .toggle-row .name {
      font-size: 16px;
      font-weight: 500;
      color: #000;
    }
    .toggle-row .hint {
      margin-top: 2px;
      font-size: 14px;
      color: #6b7280;
    }
    .switch {
      position: relative;
      width: 44px;
      height: 26px;
      background: #e5e7eb;
      border-radius: 9999px;
      transition: background 0.16s;
    }
    .switch::after {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      content: "";
      background: #fff;
      border-radius: 9999px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
      transition: left 0.16s;
    }
    .switch.on {
      background: #29603e;
    }
    .switch.on::after {
      left: 21px;
    }
    </style>
  </head>
  <body>
    <div>
      <div class="label">
        Step progress · 6px · neutral track · primary fill
      </div>
      <div class="bar"><div class="fill" style="width:38%"></div></div>
    </div>
    <div>
      <div class="label">Loading bar · 2px · divider track</div>
      <div class="thin-bar"><div class="fill" style="width:74%"></div></div>
    </div>
    <div class="toggle-row">
      <div class="body">
        <div class="name">Lock during fajr</div>
        <div class="hint">Disable to skip the dawn window</div>
      </div>
      <div class="switch on"></div>
    </div>
    <div class="toggle-row">
      <div class="body">
        <div class="name">Strict mode</div>
        <div class="hint">No bypass during salah</div>
      </div>
      <div class="switch"></div>
    </div>
  </body>
</html>
