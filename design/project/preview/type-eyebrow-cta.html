<!doctype html>
<!-- @dsCard group="Brand" name="Type — Eyebrow & CTA" subtitle="All-caps tracked eyebrow + CTA + badge" viewport="700x320" -->
<html><head><meta charset="utf-8"><title>Type — Eyebrow & CTA</title>
<style>
@font-face { font-family: "Inter"; src: url("../fonts/Inter-VariableFont_opsz_wght.ttf") format("truetype"); font-weight: 100 900; }
@font-face { font-family: "Libre Baskerville"; src: url("../fonts/LibreBaskerville-Bold.ttf") format("truetype"); font-weight: 700; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; font-family: "Inter", sans-serif; color: #000; }
body { padding: 30px 36px; }
.spec { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: #9CA3AF; letter-spacing: .04em; }
.row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }

.eyebrow-line { display:flex; align-items:center; gap:10px; }
.eyebrow-line .rule { width: 28px; height: 1px; background: #29603E; }
.eyebrow-line .text {
  font-size: 10px; font-weight: 700; letter-spacing: .24em;
  text-transform: uppercase; color: #6B7280;
}
.cta {
  display: inline-flex; align-items: center; justify-content: center;
  height: 64px; min-width: 280px;
  padding: 0 36px; border: 0; border-radius: 16px;
  background: #29603E; color: #fff;
  font-family: "Inter"; font-size: 16px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
}
.badge {
  display: inline-flex; align-items: center;
  background: #29603E; color: #fff;
  padding: 4px 10px; border-radius: 9999px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
}
</style></head><body>
<div class="row">
  <div class="spec">EYEBROW · Inter 10 / 700 · 0.24em tracking · 28×1 rule</div>
  <div class="eyebrow-line"><span class="rule"></span><span class="text">Worldwide</span></div>
</div>
<div class="row">
  <div class="spec">CTA LABEL · Inter 16 / 700 · 0.06em tracking · UPPERCASE</div>
  <button class="cta">Try for $0.00</button>
</div>
<div class="row">
  <div class="spec">BADGE · Inter 10 / 700 · 0.06em · primary fill</div>
  <div><span class="badge">7 day free trial</span></div>
</div>
</body></html>
