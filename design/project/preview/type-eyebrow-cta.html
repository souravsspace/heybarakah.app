<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Type — Eyebrow & CTA</title>
    <style>
    @font-face {
      font-family: "Inter";
      src: url("../fonts/Inter.ttf") format("truetype");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Libre Baskerville";
      src: url("../fonts/LibreBaskerville-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      padding: 0;
      margin: 0;
      font-family: "Inter", sans-serif;
      color: #000;
      background: #fff;
    }
    body {
      padding: 30px 36px;
    }
    .spec {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 10px;
      color: #9ca3af;
      letter-spacing: 0.04em;
    }
    .row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 22px;
    }

    .eyebrow-line {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .eyebrow-line .rule {
      width: 28px;
      height: 1px;
      background: #29603e;
    }
    .eyebrow-line .text {
      font-size: 10px;
      font-weight: 700;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.24em;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 280px;
      height: 64px;
      padding: 0 36px;
      font-family: "Inter";
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      background: #29603e;
      border: 0;
      border-radius: 16px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.06em;
      background: #29603e;
      border-radius: 9999px;
    }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="spec">
        EYEBROW · Inter 10 / 700 · 0.24em tracking · 28×1 rule
      </div>
      <div class="eyebrow-line">
        <span class="rule"></span><span class="text">Worldwide</span>
      </div>
    </div>
    <div class="row">
      <div class="spec">
        CTA LABEL · Inter 16 / 700 · 0.06em tracking · UPPERCASE
      </div>
      <button class="cta">Try for $0.00</button>
    </div>
    <div class="row">
      <div class="spec">BADGE · Inter 10 / 700 · 0.06em · primary fill</div>
      <div><span class="badge">7 day free trial</span></div>
    </div>
  </body>
</html>
