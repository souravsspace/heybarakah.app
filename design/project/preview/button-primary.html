<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Button — Primary</title>
    <style>
    @font-face {
      font-family: "Inter";
      src: url("../fonts/Inter.ttf") format("truetype");
      font-weight: 100 900;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      padding: 0;
      margin: 0;
      font-family: "Inter", sans-serif;
      color: #000;
      background: #fff;
    }
    body {
      padding: 32px 36px;
    }
    .label {
      margin-bottom: 10px;
      font-size: 10px;
      font-weight: 700;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .btn-row {
      display: flex;
      gap: 18px;
      margin-bottom: 22px;
    }
    .btn {
      flex: 1;
      height: 64px;
      min-height: 64px;
      font-family: "Inter";
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      border: 0;
      border-radius: 16px;
      transition: opacity 160ms;
    }
    .btn.primary {
      color: #fff;
      background: #29603e;
    }
    .btn.primary.pressed {
      opacity: 0.92;
    }
    .btn.secondary {
      color: #000;
      background: #fff;
      border: 1px solid #e5e7eb;
    }
    .btn.disabled {
      color: #6b7280;
      cursor: not-allowed;
      background: #e5e7eb;
    }
    </style>
  </head>
  <body>
    <div class="label">
      Default / Pressed / Disabled · Inter 24/700 · 64px · radius 16
    </div>
    <div class="btn-row">
      <button class="btn primary">Bismillah</button>
      <button class="btn primary pressed">Bismillah</button>
      <button class="btn disabled" disabled>Bismillah</button>
    </div>
    <div class="label">Secondary</div>
    <div class="btn-row">
      <button class="btn secondary">Not now</button>
    </div>
  </body>
</html>
