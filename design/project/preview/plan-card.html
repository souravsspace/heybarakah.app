<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Plan card</title>
    <style>
    @font-face {
      font-family: "Inter";
      src: url("../fonts/Inter.ttf") format("truetype");
      font-weight: 100 900;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      padding: 0;
      margin: 0;
      font-family: "Inter", sans-serif;
      color: #000;
      background: #fff;
    }
    body {
      display: flex;
      flex-direction: column;
      gap: 26px;
      padding: 32px 36px;
    }

    .plan {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 22px;
      background: #f4f2ee;
      border: 2.5px solid #e5e7eb;
      border-radius: 16px;
    }
    .plan.selected {
      background: #fff;
      border-color: #29603e;
    }
    .plan .badge {
      position: absolute;
      top: -11px;
      left: 16px;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.06em;
      background: #29603e;
      border-radius: 9999px;
    }
    .plan .check {
      position: absolute;
      top: -8px;
      right: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      color: #f4eddf;
      background: #29603e;
      border-radius: 9999px;
    }
    .plan .left .name-row {
      display: flex;
      gap: 10px;
      align-items: baseline;
    }
    .plan .left .name {
      font-size: 18px;
      font-weight: 700;
      color: #000;
    }
    .plan .left .strike {
      font-size: 15px;
      font-weight: 500;
      color: #6b7280;
      text-decoration: line-through;
    }
    .plan .left .sub {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #6b7280;
    }
    .plan .right {
      font-size: 17px;
      font-weight: 700;
      color: #000;
    }
    </style>
  </head>
  <body>
    <div class="plan selected">
      <span class="badge">7 DAY FREE TRIAL</span>
      <span class="check">
        <svg
          viewBox="0 0 24 24"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="5 13 10 18 19 7" />
        </svg>
      </span>
      <div class="left">
        <div class="name-row">
          <span class="name">Yearly</span><span class="strike">$239.88</span>
        </div>
        <div class="sub">12 mo · $39.99</div>
      </div>
      <div class="right">≈ $3.33 / mo</div>
    </div>

    <div class="plan">
      <div class="left">
        <div class="name-row">
          <span class="name">Monthly</span><span class="strike">$19.99</span>
        </div>
        <div class="sub">1 mo · $7.99</div>
      </div>
      <div class="right">$7.99 / mo</div>
    </div>
  </body>
</html>
