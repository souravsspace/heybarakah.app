<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Auth providers</title>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/ionicons@7.2.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <style>
    @font-face {
      font-family: "Inter";
      src: url("../fonts/Inter.ttf") format("truetype");
      font-weight: 100 900;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      padding: 0;
      margin: 0;
      font-family: "Inter", sans-serif;
      color: #000;
      background: #fff;
    }
    body {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 28px 36px;
    }

    .auth {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      height: 60px;
      font-family: "Inter";
      font-size: 16px;
      font-weight: 600;
      color: #0f1311;
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 18px;
    }
    .auth ion-icon {
      font-size: 22px;
    }
    </style>
  </head>
  <body>
    <button class="auth">
      <ion-icon name="logo-apple"></ion-icon>
      Continue with Apple
    </button>
    <button class="auth">
      <ion-icon name="logo-google"></ion-icon>
      Continue with Google
    </button>
    <button class="auth">
      <ion-icon name="mail-outline"></ion-icon>
      Continue with Email
    </button>
  </body>
</html>
