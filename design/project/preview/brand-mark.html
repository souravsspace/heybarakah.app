<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Brand mark</title>
    <style>
    @font-face {
      font-family: "Libre Baskerville";
      src: url("../fonts/LibreBaskerville-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "Inter";
      src: url("../fonts/Inter.ttf") format("truetype");
      font-weight: 100 900;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      padding: 0;
      margin: 0;
      font-family: "Inter", sans-serif;
      color: #000;
      background: #fff;
    }
    body {
      display: flex;
      gap: 36px;
      align-items: center;
      padding: 30px 36px;
    }
    .cell {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .cell .label {
      font-size: 11px;
      color: #6b7280;
    }
    .dark {
      padding: 16px 24px;
      background: #29603e;
      border-radius: 12px;
    }
    .lockup {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .lockup img {
      width: 36px;
      height: 56px;
    }
    .lockup .name {
      font-family: "Libre Baskerville", serif;
      font-size: 24px;
      font-weight: 700;
      color: #000;
      letter-spacing: 0.4px;
    }
    .lockup.on-dark .name {
      color: #fff;
    }
    </style>
  </head>
  <body>
    <div class="cell">
      <img
        src="../assets/barakah-mark.svg"
        style="width:80px;height:auto"
        alt="Barakah mark"
      >
      <div class="label">Glyph · primary green</div>
    </div>
    <div class="cell">
      <div class="dark">
        <img
          src="../assets/barakah-mark.svg"
          style="width:64px;filter:brightness(0) invert(1)"
        >
      </div>
      <div class="label">Glyph · on green</div>
    </div>
    <div class="cell">
      <div class="lockup">
        <img src="../assets/barakah-mark.svg" alt="">
        <div class="name">Barakah</div>
      </div>
      <div class="label">Lockup · serif</div>
    </div>
    <div class="cell">
      <img
        src="../assets/barakah-logo-gradient.svg"
        style="height:80px;width:auto"
      >
      <div class="label">Gradient logotype variant</div>
    </div>
  </body>
</html>
