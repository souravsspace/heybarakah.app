<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Eyebrow</title>
    <style>
    @font-face {
      font-family: "Inter";
      src: url("../fonts/Inter.ttf") format("truetype");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Libre Baskerville";
      src: url("../fonts/LibreBaskerville-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      padding: 0;
      margin: 0;
      font-family: "Inter", sans-serif;
      color: #000;
      background: #fff;
    }
    body {
      display: flex;
      flex-direction: column;
      gap: 26px;
      padding: 30px 36px;
    }
    .spec {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 10px;
      color: #9ca3af;
    }
    .eyebrow-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .rule {
      width: 28px;
      height: 1px;
      background: #29603e;
    }
    .eyebrow-txt {
      font-size: 10px;
      font-weight: 700;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.24em;
    }
    .h2 {
      font-family: "Libre Baskerville", serif;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
    }
    </style>
  </head>
  <body>
    <div class="eyebrow-block">
      <div class="spec">
        EYEBROW · 28×1 rule · 12px gap · Inter 10/700 · 0.24em
      </div>
      <div class="rule"></div>
      <div class="eyebrow-txt">Worldwide</div>
      <div class="h2">12,847 Muslims, this moment.</div>
    </div>
    <div class="eyebrow-block">
      <div class="rule"></div>
      <div class="eyebrow-txt">Maghrib · in 18:42</div>
      <div class="h2">Return to Allah</div>
    </div>
  </body>
</html>
