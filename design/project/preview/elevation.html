<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Elevation</title>
    <style>
    @font-face {
      font-family: "Inter";
      src: url("../fonts/Inter.ttf") format("truetype");
      font-weight: 100 900;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      padding: 0;
      margin: 0;
      font-family: "Inter", sans-serif;
      color: #000;
      background: #fff;
    }
    body {
      padding: 30px 36px;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .cell {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .card {
      width: 100%;
      height: 96px;
      background: #fff;
      border-radius: 16px;
    }
    .name {
      font-size: 12px;
      font-weight: 600;
    }
    .spec {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #6b7280;
      text-align: center;
    }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="cell">
        <div class="card" style="border: 1px solid #E5E7EB;"></div>
        <div class="name">Flat (default)</div>
        <div class="spec">1px solid #E5E7EB<br>no shadow</div>
      </div>
      <div class="cell">
        <div
          class="card"
          style="border: 1px solid #E5E7EB; box-shadow: 0 4px 10px rgba(11,23,16,.04);"
        ></div>
        <div class="name">Swipe card rest</div>
        <div class="spec">
          0 4 10 #0B1710 · 0.04<br>
          <span style="color:#9CA3AF">welcome stack only</span>
        </div>
      </div>
      <div class="cell">
        <div
          class="card"
          style="border: 1px solid #E5E7EB; box-shadow: 0 8px 18px rgba(11,23,16,.08);"
        ></div>
        <div class="name">Swipe card active</div>
        <div class="spec">
          0 8 18 #0B1710 · 0.08<br>
          <span style="color:#9CA3AF">topmost card only</span>
        </div>
      </div>
    </div>
  </body>
</html>
