<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Type — Display</title>
    <style>
    @font-face {
      font-family: "Libre Baskerville";
      src: url("../fonts/LibreBaskerville-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "Inter";
      src: url("../fonts/Inter.ttf") format("truetype");
      font-weight: 100 900;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      padding: 0;
      margin: 0;
      font-family: "Inter", sans-serif;
      color: #000;
      background: #fff;
    }
    body {
      padding: 30px 36px;
    }
    .spec {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 10px;
      color: #9ca3af;
      letter-spacing: 0.04em;
    }
    .headline {
      font-family: "Libre Baskerville", Georgia, serif;
      font-weight: 700;
      color: #000;
      letter-spacing: 0;
    }
    .row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="spec">DISPLAY · Libre Baskerville Bold · 38 / 46 · 700</div>
      <div class="headline" style="font-size:38px;line-height:46px">
        Your phone, on prayer time.
      </div>
    </div>
    <div class="row">
      <div class="spec">H1 · Libre Baskerville Bold · 31 / 37 · 700</div>
      <div class="headline" style="font-size:31px;line-height:37px">
        This is what salah looks like.
      </div>
    </div>
    <div class="row">
      <div class="spec">H2 · Libre Baskerville Bold · 24 / 30 · 700</div>
      <div class="headline" style="font-size:24px;line-height:30px">
        Lock in your five. Begin the return.
      </div>
    </div>
  </body>
</html>
