<!doctype html>
<!-- @dsCard group="Brand" name="Option row — radio" subtitle="Default / selected / hint copy" viewport="700x280" -->
<html><head><meta charset="utf-8"><title>Option row</title>
<style>
@font-face { font-family: "Inter"; src: url("../fonts/Inter-VariableFont_opsz_wght.ttf") format("truetype"); font-weight: 100 900; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; font-family: "Inter", sans-serif; color: #000; }
body { padding: 28px 36px; display: flex; flex-direction: column; gap: 14px; }

.opt {
  display: flex; align-items: center; gap: 14px;
  min-height: 60px; padding: 12px 20px;
  border-radius: 12px; border: 1.5px solid #E5E7EB; background: #fff;
}
.opt.selected { background: #E8F0EA; border-color: #29603E; }
.opt .body { flex: 1; }
.opt .label { font-size: 16px; font-weight: 500; color: #000; }
.opt.selected .label { color: #29603E; font-weight: 600; }
.opt .hint { font-size: 14px; color: #6B7280; margin-top: 2px; }
.dot { width: 22px; height: 22px; border-radius: 9999px; border: 1px solid #E5E7EB; }
.dot.checked {
  display: inline-flex; align-items: center; justify-content: center;
  background: #29603E; border-color: #29603E; color: #fff;
}
.dot.checked svg { width: 14px; height: 14px; }
</style></head><body>
<div class="opt">
  <div class="body">
    <div class="label">Hanafi</div>
    <div class="hint">South & Central Asia, Turkey</div>
  </div>
  <div class="dot"></div>
</div>
<div class="opt selected">
  <div class="body">
    <div class="label">Shafi'i</div>
    <div class="hint">Egypt, Levant, Southeast Asia</div>
  </div>
  <div class="dot checked">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 13 10 18 19 7"/></svg>
  </div>
</div>
<div class="opt">
  <div class="body">
    <div class="label">Maliki</div>
    <div class="hint">North & West Africa</div>
  </div>
  <div class="dot"></div>
</div>
</body></html>
