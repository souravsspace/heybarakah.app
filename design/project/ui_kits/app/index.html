<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Barakah — App UI Kit</title>
    <style>
    @font-face {
      font-family: "Inter";
      src: url("../../fonts/Inter.ttf") format("truetype");
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: "Libre Baskerville";
      src: url("../../fonts/LibreBaskerville-Bold.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      min-height: 100vh;
      padding: 0;
      margin: 0;
      font-family: "Inter", sans-serif;
      background: #f4f2ee;
    }
    .doc {
      max-width: 1640px;
      padding: 40px 28px 140px;
      margin: 0 auto;
    }
    .doc-head {
      margin-bottom: 24px;
      text-align: center;
    }
    .doc-head h1 {
      margin: 0;
      font:
        700 28px / 1.15 "Libre Baskerville",
        Georgia,
        serif;
      color: #0f1311;
      letter-spacing: -0.01em;
    }
    .doc-head p {
      margin: 8px 0 0;
      font-size: 13px;
      color: #6b7280;
    }
    .group {
      margin-top: 36px;
    }
    .group-head {
      display: flex;
      gap: 14px;
      align-items: center;
      max-width: 1500px;
      margin-right: auto;
      margin-bottom: 18px;
      margin-left: auto;
    }
    .group-head h2 {
      margin: 0;
      font: 700 11px / 1 "Inter";
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.24em;
    }
    .group-head .rule {
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }
    .group-head .count {
      font: 600 11px / 1 "Inter";
      color: #6b7280;
      letter-spacing: 0.02em;
    }
    .stage {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      align-items: flex-start;
      justify-content: center;
    }
    .frame-label {
      margin-top: 14px;
      font: 700 11px / 1 "Inter";
      color: #6b7280;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .frame-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .nav-strip {
      position: fixed;
      bottom: 20px;
      left: 50%;
      z-index: 9999;
      display: flex;
      gap: 2px;
      align-items: center;
      padding: 5px;
      color: #fff;
      background: #0f1311;
      border-radius: 9999px;
      box-shadow: 0 12px 32px rgba(11, 23, 16, 0.22);
      transform: translateX(-50%);
    }
    .nav-strip button {
      padding: 7px 12px;
      font: 600 11.5px / 1 "Inter";
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 0.02em;
      cursor: pointer;
      background: transparent;
      border: 0;
      border-radius: 9999px;
    }
    .nav-strip button.active {
      color: #fff;
      background: #29603e;
    }
    .nav-strip .divider {
      width: 1px;
      height: 18px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.18);
    }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script type="text/babel" src="ios-frame.jsx"></script>
    <script type="text/babel" src="components.jsx"></script>
    <script type="text/babel" src="screens.jsx"></script>
    <script type="text/babel" src="app-screens.jsx"></script>

    <script type="text/babel">
  const screens = [
    { id: 'welcome',  label: '01 Welcome',      group: 'Onboarding', Comp: WelcomeScreen },
    { id: 'promise',  label: '02 Promise',      group: 'Onboarding', Comp: PromiseScreen },
    { id: 'lock',     label: '03 Lock preview', group: 'Onboarding', Comp: LockPreviewScreen },
    { id: 'madhab',   label: '04 Madhab',       group: 'Onboarding', Comp: MadhabScreen },
    { id: 'paywall',  label: '05 Paywall',      group: 'Onboarding', Comp: PaywallScreen },
    { id: 'home',     label: '06 Home',         group: 'App',        Comp: HomeScreen },
    { id: 'progress', label: '07 Progress',     group: 'App',        Comp: ProgressScreen },
    { id: 'dhikr',    label: '08 Dhikr',        group: 'App',        Comp: DhikrScreen },
    { id: 'locked',   label: '09 Locked',       group: 'App',        Comp: LockedScreen },
    { id: 'profile',  label: '10 Profile',      group: 'App',        Comp: ProfileScreen },
  ];

  function App() {
    const [active, setActive] = React.useState('welcome');
    const next = (cur) => () => {
      const i = screens.findIndex(s => s.id === cur);
      setActive(screens[Math.min(i + 1, screens.length - 1)].id);
    };
    const back = (cur) => () => {
      const i = screens.findIndex(s => s.id === cur);
      setActive(screens[Math.max(i - 1, 0)].id);
    };

    const groups = [
      { id: 'Onboarding', subtitle: 'First-run flow' },
      { id: 'App',        subtitle: 'Signed-in tabs' },
    ];

    return (
      <React.Fragment>
        <div className="doc">
          <div className="doc-head">
            <h1>Barakah — App UI Kit</h1>
            <p>Pixel recreation of the heybarakah.app mobile flow · onboarding + main app</p>
          </div>

          {groups.map(g => {
            const list = screens.filter(s => s.group === g.id);
            return (
              <div className="group" key={g.id}>
                <div className="group-head">
                  <h2>{g.id}</h2>
                  <span className="count">· {g.subtitle}</span>
                  <div className="rule"/>
                  <span className="count">{list.length} screens</span>
                </div>
                <div className="stage">
                  {list.map(s => {
                    const isActive = s.id === active;
                    const Comp = s.Comp;
                    const props = { onNext: next(s.id), onBack: back(s.id) };
                    return (
                      <div className="frame-col" key={s.id} data-screen-label={s.label}>
                        <IOSDevice>
                          <Comp {...props}/>
                        </IOSDevice>
                        <div className="frame-label" style={{ opacity: isActive ? 1 : 0.55, color: isActive ? '#29603E' : '#6B7280' }}>{s.label}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>

        <div className="nav-strip">
          {screens.map((s, i) => {
            const prevGroup = i > 0 ? screens[i - 1].group : null;
            const showDivider = prevGroup && prevGroup !== s.group;
            return (
              <React.Fragment key={s.id}>
                {showDivider && <div className="divider"/>}
                <button className={s.id === active ? 'active' : ''} onClick={() => setActive(s.id)}>
                  {s.label}
                </button>
              </React.Fragment>
            );
          })}
        </div>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
  </body>
</html>
