<!doctype html>
<html><head><meta charset="utf-8"><title>Input</title>
<style>
@font-face { font-family: "Inter"; src: url("../fonts/Inter-VariableFont_opsz_wght.ttf") format("truetype"); font-weight: 100 900; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; font-family: "Inter", sans-serif; color: #000; }
body { padding: 28px 36px; display: flex; flex-direction: column; gap: 14px; }
.field-label { font-size: 12px; font-weight: 600; color: #6B7280; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 4px; }
.input {
  width: 100%; height: 60px;
  background: #fff; border-radius: 18px;
  border: 1.5px solid #E5E7EB;
  padding: 0 18px;
  font-family: "Inter"; font-size: 18px; font-weight: 500;
  color: #000;
}
.input::placeholder { color: #9CA3AF; font-weight: 500; }
.input.focused { border-color: #29603E; outline: none; }
.input.error { border-color: #B42318; }
.err { font-size: 12px; color: #B42318; margin-top: 6px; }
</style></head><body>
<div>
  <div class="field-label">Email</div>
  <input class="input" placeholder="you@email.com"/>
</div>
<div>
  <div class="field-label">Name</div>
  <input class="input focused" value="Sana"/>
</div>
<div>
  <div class="field-label">Code</div>
  <input class="input error" value="00000"/>
  <div class="err">That code didn't match. Try again.</div>
</div>
</body></html>
