<!doctype html>
<html><head><meta charset="utf-8"><title>List rows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .wrap{padding:18px 32px;}
  .list{border-top:1px solid #E5E7EB;}
  .row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #E5E7EB;}
  .icon{width:32px;height:32px;border:1.5px solid #29603E;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#29603E;font-family:var(--font-serif);font-weight:700;}
  .row .name{flex:1;font-family:var(--font-sans);font-size:16px;font-weight:500;color:#000;}
  .row .time{font-family:var(--font-mono);font-size:14px;color:#000;}
  .row.now .time{color:#29603E;font-weight:600;}
  .row.now .name::after{content:" · now";color:#29603E;font-family:var(--font-sans);font-weight:500;}
</style></head>
<body><div class="wrap">
  <div class="list">
    <div class="row"><div class="icon">F</div><div class="name">Fajr</div><div class="time">5:11 am</div></div>
    <div class="row"><div class="icon">D</div><div class="name">Dhuhr</div><div class="time">12:24 pm</div></div>
    <div class="row"><div class="icon">A</div><div class="name">Asr</div><div class="time">3:48 pm</div></div>
    <div class="row now"><div class="icon">M</div><div class="name">Maghrib</div><div class="time">5:42 pm</div></div>
  </div>
</div></body></html>
