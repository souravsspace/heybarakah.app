<!doctype html>
<html><head><meta charset="utf-8"><title>Display Type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .wrap{padding:28px 32px;}
  .specimen{font-family:var(--font-serif);font-size:54px;line-height:1.1;font-weight:700;color:var(--fg-1);letter-spacing:-0.01em;}
  .meta{margin-top:14px;display:flex;gap:18px;font-family:var(--font-sans);font-size:12px;color:var(--fg-2);letter-spacing:0.04em;text-transform:uppercase;}
  .meta b{color:var(--fg-1);font-weight:600;}
</style></head>
<body><div class="wrap">
  <div class="specimen">Your salah, on time.</div>
  <div class="meta">
    <span><b>Libre Baskerville</b> · 700</span>
    <span>Display · 38/45</span>
    <span>Serif · headlines only</span>
  </div>
</div></body></html>
