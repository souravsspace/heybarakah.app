<!doctype html>
<html><head><meta charset="utf-8"><title>Iconography</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.2.2/dist/ionicons/ionicons.esm.js"></script>
<style>
@font-face { font-family: "Inter"; src: url("../fonts/Inter-VariableFont_opsz_wght.ttf") format("truetype"); font-weight: 100 900; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; font-family: "Inter", sans-serif; color: #000; }
body { padding: 28px 36px; }
.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 8px; }
.cell ion-icon { font-size: 28px; color: #0F1311; }
.cell.active ion-icon { color: #29603E; }
.cell.muted  ion-icon { color: #6B7280; }
.name { font-size: 11px; color: #6B7280; font-family: ui-monospace, Menlo, monospace; text-align: center; }
</style></head><body>
<div class="grid">
  <div class="cell active"><ion-icon name="checkmark-circle"></ion-icon><div class="name">checkmark-circle</div></div>
  <div class="cell"><ion-icon name="checkmark"></ion-icon><div class="name">checkmark</div></div>
  <div class="cell muted"><ion-icon name="lock-closed-outline"></ion-icon><div class="name">lock-closed-outline</div></div>
  <div class="cell"><ion-icon name="logo-apple"></ion-icon><div class="name">logo-apple</div></div>
  <div class="cell"><ion-icon name="logo-google"></ion-icon><div class="name">logo-google</div></div>
  <div class="cell"><ion-icon name="mail-outline"></ion-icon><div class="name">mail-outline</div></div>
  <div class="cell muted"><ion-icon name="chevron-back"></ion-icon><div class="name">chevron-back</div></div>
  <div class="cell muted"><ion-icon name="chevron-forward"></ion-icon><div class="name">chevron-forward</div></div>
  <div class="cell muted"><ion-icon name="information-circle-outline"></ion-icon><div class="name">information-circle-outline</div></div>
  <div class="cell muted"><ion-icon name="time-outline"></ion-icon><div class="name">time-outline</div></div>
  <div class="cell muted"><ion-icon name="location-outline"></ion-icon><div class="name">location-outline</div></div>
  <div class="cell muted"><ion-icon name="moon-outline"></ion-icon><div class="name">moon-outline</div></div>
</div>
</body></html>
