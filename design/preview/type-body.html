<!doctype html>
<html><head><meta charset="utf-8"><title>Body & Labels</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .wrap{padding:24px 32px;display:grid;grid-template-columns:96px 1fr;gap:12px 18px;align-items:baseline;}
  .tag{font-family:var(--font-sans);font-size:11px;color:var(--fg-2);letter-spacing:0.06em;text-transform:uppercase;}
  .body-md{font-family:var(--font-sans);font-size:16px;line-height:24px;color:var(--fg-1);}
  .body-sm{font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--fg-2);}
  .label{font-family:var(--font-sans);font-size:16px;font-weight:500;line-height:24px;color:var(--fg-1);}
  .cap{font-family:var(--font-sans);font-size:12px;font-weight:500;line-height:16px;color:var(--fg-2);letter-spacing:0.02em;}
  .eyebrow{font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-primary);}
</style></head>
<body><div class="wrap">
  <div class="tag">Body MD</div><div class="body-md">Inter Regular at 16 / 24. The default reading size for paragraphs.</div>
  <div class="tag">Body SM</div><div class="body-sm">Inter Regular at 14 / 20. Used for metadata, captions, and quiet supporting copy.</div>
  <div class="tag">Label MD</div><div class="label">Begin your day</div>
  <div class="tag">Caption</div><div class="cap">Updated 2 minutes ago</div>
  <div class="tag">Eyebrow</div><div class="eyebrow">PRAYER LOCK · ENABLED</div>
</div></body></html>
