<!doctype html>
<html><head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#FAFAF7;}
  .wrap{display:flex;gap:24px;padding:32px;align-items:center;}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .box{width:140px;height:70px;background:#fff;border-radius:4px;border:1px solid #E5E7EB;display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-size:13px;color:#6B7280;}
  .cta{background:#29603E;color:#fff;font-weight:600;border-radius:9999px;border:none;}
  .lbl{font-family:var(--font-mono);font-size:11px;color:#000;font-weight:600;}
  .desc{font-family:var(--font-sans);font-size:11px;color:#6B7280;text-align:center;}
</style></head>
<body><div class="wrap">
  <div class="col">
    <div class="box">card</div>
    <div class="lbl">shadow-card</div>
    <div class="desc">0 1px 2px /04</div>
  </div>
  <div class="col">
    <div class="box" style="box-shadow:0 1px 2px rgba(0,0,0,0.04)">card · raised</div>
    <div class="lbl">shadow-card</div>
    <div class="desc">elevated content</div>
  </div>
  <div class="col">
    <div class="box" style="box-shadow:0 6px 20px rgba(0,0,0,0.08)">popover</div>
    <div class="lbl">shadow-pop</div>
    <div class="desc">sheets · modals</div>
  </div>
  <div class="col">
    <div class="box cta" style="box-shadow:0 8px 24px rgba(41,96,62,0.28)">CTA</div>
    <div class="lbl">shadow-cta</div>
    <div class="desc">brand-defining glow</div>
  </div>
</div></body></html>
