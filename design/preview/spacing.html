<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<style>
@font-face { font-family: "Inter"; src: url("../fonts/Inter-VariableFont_opsz_wght.ttf") format("truetype"); font-weight: 100 900; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; font-family: "Inter", sans-serif; color: #000; }
body { padding: 28px 32px; }
.row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; height: 22px; }
.name { width: 80px; font-size: 12px; font-weight: 600; }
.bar { height: 14px; background: #29603E; border-radius: 4px; }
.spec { font-size: 11px; color: #6B7280; font-family: ui-monospace, Menlo, monospace; }
</style></head><body>
<div class="row"><div class="name">xs</div><div class="bar" style="width:6px"></div><div class="spec">6px</div></div>
<div class="row"><div class="name">sm</div><div class="bar" style="width:14px"></div><div class="spec">14px</div></div>
<div class="row"><div class="name">md · gutter</div><div class="bar" style="width:24px"></div><div class="spec">24px</div></div>
<div class="row"><div class="name">lg</div><div class="bar" style="width:40px"></div><div class="spec">40px</div></div>
<div class="row"><div class="name">xl</div><div class="bar" style="width:100px"></div><div class="spec">100px · section gap</div></div>
</body></html>
