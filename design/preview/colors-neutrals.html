<!doctype html>
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .wrap{display:flex;gap:10px;padding:24px 32px;}
  .sw{flex:1;border-radius:var(--radius-sm);padding:14px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--color-border);}
  .name{font-family:var(--font-sans);font-size:12px;font-weight:600;color:#000;}
  .hex{font-family:var(--font-mono);font-size:11px;color:#6B7280;margin-top:2px;}
  .role{font-family:var(--font-sans);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:#6B7280;}
  .black{background:#000;}
  .black .name,.black .hex,.black .role{color:#fff;}
  .black .hex,.black .role{opacity:0.7;}
  .fg-muted{background:#6B7280;color:#fff;}
  .fg-muted .name,.fg-muted .role{color:#fff;}
  .fg-muted .hex{color:#fff;opacity:0.8;}
  .border{background:#E5E7EB;}
  .muted{background:#F3F4F6;}
  .soft{background:#FAFAF7;}
  .white{background:#fff;}
</style></head>
<body><div class="wrap">
  <div class="sw black"><div class="role">Foreground</div><div><div class="name">Black</div><div class="hex">#000000</div></div></div>
  <div class="sw fg-muted"><div class="role">FG muted</div><div><div class="name">Cool gray</div><div class="hex">#6B7280</div></div></div>
  <div class="sw border"><div class="role">Border</div><div><div class="name">Hairline</div><div class="hex">#E5E7EB</div></div></div>
  <div class="sw muted"><div class="role">BG muted</div><div><div class="name">Chip / quiet</div><div class="hex">#F3F4F6</div></div></div>
  <div class="sw soft"><div class="role">BG soft</div><div><div class="name">Warm white</div><div class="hex">#FAFAF7</div></div></div>
  <div class="sw white"><div class="role">Surface</div><div><div class="name">White</div><div class="hex">#FFFFFF</div></div></div>
</div></body></html>
