<!doctype html>
<html><head><meta charset="utf-8"><title>Button — Primary</title>
<style>
@font-face { font-family: "Inter"; src: url("../fonts/Inter-VariableFont_opsz_wght.ttf") format("truetype"); font-weight: 100 900; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; font-family: "Inter", sans-serif; color: #000; }
body { padding: 32px 36px; }
.label { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color:#6B7280; margin-bottom: 10px; }
.btn-row { display: flex; gap: 18px; margin-bottom: 22px; }
.btn {
  flex: 1; border: 0; height: 64px; min-height: 64px; border-radius: 16px;
  font-family: "Inter"; font-size: 24px; font-weight: 700; letter-spacing: 0.2px;
  cursor: pointer; transition: opacity 160ms;
}
.btn.primary { background: #29603E; color: #fff; }
.btn.primary.pressed { opacity: .92; }
.btn.secondary { background: #fff; color: #000; border: 1px solid #E5E7EB; }
.btn.disabled { background: #E5E7EB; color: #6B7280; cursor: not-allowed; }
</style></head><body>
<div class="label">Default / Pressed / Disabled · Inter 24/700 · 64px · radius 16</div>
<div class="btn-row">
  <button class="btn primary">Bismillah</button>
  <button class="btn primary pressed">Bismillah</button>
  <button class="btn disabled" disabled>Bismillah</button>
</div>
<div class="label">Secondary</div>
<div class="btn-row">
  <button class="btn secondary">Not now</button>
</div>
</body></html>
