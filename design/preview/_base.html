<!-- Shared base for all preview cards. Each card is ~700×<h>px, no titles (asset name renders outside). -->
<style>
  @import url("../colors_and_type.css");
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-surface);
    color: var(--color-ink);
    font-family: var(--font-sans);
  }
  body { padding: 28px 32px; }
  .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .swatch {
    display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }
  .swatch .chip {
    width: 100%;
    aspect-ratio: 1.6 / 1;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.05);
  }
  .swatch .name {
    font-size: 12px; font-weight: 600; color: var(--color-ink);
  }
  .swatch .hex {
    font-size: 11px; color: var(--color-fg-muted);
    font-family: ui-monospace, Menlo, monospace;
  }
  .label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--color-fg-muted);
  }
</style>
