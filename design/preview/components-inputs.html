<!doctype html>
<html><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .wrap{padding:22px 32px;display:flex;gap:16px;}
  .col{flex:1;display:flex;flex-direction:column;gap:8px;}
  label{font-family:var(--font-sans);font-size:13px;font-weight:500;color:#000;}
  .input{font-family:var(--font-sans);font-size:16px;padding:14px;border:1px solid #E5E7EB;border-radius:4px;background:#fff;color:#000;outline:none;}
  .input:focus,.input.focus{border-color:#29603E;box-shadow:0 0 0 3px rgba(41,96,62,0.12);}
  .input.err{border-color:#B91C1C;}
  .help{font-family:var(--font-sans);font-size:12px;color:#6B7280;}
  .err-msg{font-family:var(--font-sans);font-size:12px;color:#B91C1C;}
</style></head>
<body><div class="wrap">
  <div class="col"><label>Your name</label><input class="input" value="Yusuf" /><div class="help">As it appears in your dhikr log</div></div>
  <div class="col"><label>Email</label><input class="input focus" value="you@masjid.app" /><div class="help">Focused</div></div>
  <div class="col"><label>City</label><input class="input err" value="" placeholder="Required" /><div class="err-msg">Please enter your city</div></div>
</div></body></html>
