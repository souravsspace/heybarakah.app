<!doctype html>
<html><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#FAFAF7;}
  .wrap{padding:24px 32px;display:flex;gap:16px;}
  .card{flex:1;background:#fff;border:1px solid #E5E7EB;border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:6px;}
  .eyebrow{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#29603E;}
  .ttl{font-family:var(--font-serif);font-size:20px;font-weight:700;color:#000;line-height:1.2;}
  .meta{font-family:var(--font-sans);font-size:13px;color:#6B7280;}
  .row{display:flex;justify-content:space-between;align-items:baseline;}
  .time{font-family:var(--font-serif);font-size:24px;font-weight:700;color:#29603E;}
</style></head>
<body><div class="wrap">
  <div class="card">
    <div class="eyebrow">Next prayer</div>
    <div class="row"><div class="ttl">Maghrib</div><div class="time">5:42 pm</div></div>
    <div class="meta">in 1 h 04 min · Phoenix, AZ</div>
  </div>
  <div class="card">
    <div class="eyebrow">Today's lesson</div>
    <div class="ttl">The meaning of Bismillah</div>
    <div class="meta">4 min read · Lesson 2 of 30</div>
  </div>
</div></body></html>
