<!doctype html>
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;height:100%;}
  .wrap{display:flex;align-items:center;gap:24px;padding:20px 28px;height:100%;box-sizing:border-box;}
  .mark{width:120px;height:120px;display:flex;align-items:center;justify-content:center;background:var(--bg-3);border:1px solid var(--color-border);border-radius:var(--radius-sm);}
  .mark.dark{background:#1B3F29;}
  .mark img{width:88px;height:88px;object-fit:contain;}
  .meta{flex:1;min-width:0;}
  .meta .name{font-family:var(--font-serif);font-size:30px;font-weight:700;color:var(--fg-1);}
  .meta .sub{font-family:var(--font-sans);font-size:13px;color:var(--fg-2);margin-top:6px;line-height:18px;}
</style></head>
<body><div class="wrap">
  <div class="mark"><img src="../assets/barakah-logo.svg" alt="Barakah"></div>
  <div class="mark dark"><img src="../assets/barakah-logo-white.svg" alt="Barakah"></div>
  <div class="meta">
    <div class="name">Barakah</div>
    <div class="sub">Primary mark · stylised glyph in mosque-green<br>Min size 32px · do not stretch or recolor</div>
  </div>
</div></body></html>
