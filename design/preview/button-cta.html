<!doctype html>
<html><head><meta charset="utf-8"><title>CTA & Link buttons</title>
<style>
@font-face { font-family: "Inter"; src: url("../fonts/Inter-VariableFont_opsz_wght.ttf") format("truetype"); font-weight: 100 900; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; font-family: "Inter", sans-serif; color: #000; }
body { padding: 32px 36px; }
.label { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color:#6B7280; margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; flex-wrap: wrap; }

.cta-uppercase {
  background: #29603E; color: #fff; border: 0;
  height: 64px; padding: 0 32px; border-radius: 16px;
  font-family: "Inter"; font-size: 16px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
}
.link-btn {
  background: transparent; border: 0; color: #6B7280;
  font-size: 14px; text-decoration: underline;
  font-family: "Inter";
}
.link-btn.strong { color: #000; font-weight: 700; }
</style></head><body>
<div class="label">All-caps CTA — yearly trial / paywall</div>
<div class="row">
  <button class="cta-uppercase">Try for $0.00</button>
  <button class="cta-uppercase">Start monthly · $7.99/mo</button>
</div>
<div class="label">Link buttons — tertiary, underlined, sentence case</div>
<div class="row">
  <button class="link-btn">Terms · Privacy</button>
  <button class="link-btn">Restore purchase</button>
  <button class="link-btn">Already subscribed? <span class="strong">Log In</span></button>
</div>
</body></html>
