<!doctype html>
<html><head><meta charset="utf-8"><title>Brand Color</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .wrap{display:flex;gap:14px;padding:24px 32px;}
  .sw{flex:1;border-radius:var(--radius-sm);padding:18px;display:flex;flex-direction:column;justify-content:space-between;min-height:140px;border:1px solid var(--color-border);}
  .sw .name{font-family:var(--font-sans);font-size:13px;font-weight:600;}
  .sw .hex{font-family:var(--font-mono);font-size:12px;opacity:0.85;margin-top:4px;}
  .sw .role{font-family:var(--font-sans);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;opacity:0.75;}
  .primary{background:#29603E;color:#fff;border-color:#29603E;}
  .hover{background:#234F34;color:#fff;border-color:#234F34;}
  .press{background:#1B3F29;color:#fff;border-color:#1B3F29;}
  .soft{background:#EAF2EC;color:#29603E;}
</style></head>
<body><div class="wrap">
  <div class="sw primary"><div class="role">Primary</div><div><div class="name">Mosque green</div><div class="hex">#29603E</div></div></div>
  <div class="sw hover"><div class="role">Hover</div><div><div class="name">Deeper green</div><div class="hex">#234F34</div></div></div>
  <div class="sw press"><div class="role">Press</div><div><div class="name">Pressed</div><div class="hex">#1B3F29</div></div></div>
  <div class="sw soft"><div class="role">Soft</div><div><div class="name">Tinted bg</div><div class="hex">#EAF2EC</div></div></div>
</div></body></html>
