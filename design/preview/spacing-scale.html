<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .wrap{padding:24px 32px;display:grid;grid-template-columns:80px 1fr 80px;gap:12px 16px;align-items:center;}
  .tag{font-family:var(--font-mono);font-size:12px;color:var(--fg-1);font-weight:600;}
  .px{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);text-align:right;}
  .bar{height:14px;background:#29603E;border-radius:2px;}
</style></head>
<body><div class="wrap">
  <div class="tag">xs</div><div><div class="bar" style="width:6px"></div></div><div class="px">6 px</div>
  <div class="tag">sm</div><div><div class="bar" style="width:14px"></div></div><div class="px">14 px</div>
  <div class="tag">md</div><div><div class="bar" style="width:24px"></div></div><div class="px">24 px</div>
  <div class="tag">lg</div><div><div class="bar" style="width:40px"></div></div><div class="px">40 px</div>
  <div class="tag">xl</div><div><div class="bar" style="width:100px"></div></div><div class="px">100 px</div>
</div></body></html>
