<!doctype html>
<html><head><meta charset="utf-8"><title>Progress & toggle</title>
<style>
@font-face { font-family: "Inter"; src: url("../fonts/Inter-VariableFont_opsz_wght.ttf") format("truetype"); font-weight: 100 900; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; font-family: "Inter", sans-serif; color: #000; }
body { padding: 30px 36px; display: flex; flex-direction: column; gap: 18px; }
.label { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color:#6B7280; margin-bottom: 8px; }
.bar { height: 6px; background: #E5E7EB; border-radius: 9999px; overflow: hidden; }
.bar > .fill { height: 100%; background: #29603E; }
.thin-bar { height: 2px; background: #EFEFEF; border-radius: 9999px; overflow: hidden; }
.thin-bar > .fill { height: 100%; background: #29603E; }

.toggle-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 20px; border: 1px solid #E5E7EB; border-radius: 8px; background: #fff;
}
.toggle-row .body { flex: 1; }
.toggle-row .name { font-size: 16px; font-weight: 500; color: #000; }
.toggle-row .hint { font-size: 14px; color: #6B7280; margin-top: 2px; }
.switch { width: 44px; height: 26px; background: #E5E7EB; border-radius: 9999px; position: relative; transition: background .16s; }
.switch::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; background:#fff; border-radius: 9999px; box-shadow: 0 1px 2px rgba(0,0,0,.18); transition: left .16s; }
.switch.on { background: #29603E; }
.switch.on::after { left: 21px; }
</style></head><body>
<div>
  <div class="label">Step progress · 6px · neutral track · primary fill</div>
  <div class="bar"><div class="fill" style="width:38%"></div></div>
</div>
<div>
  <div class="label">Loading bar · 2px · divider track</div>
  <div class="thin-bar"><div class="fill" style="width:74%"></div></div>
</div>
<div class="toggle-row">
  <div class="body">
    <div class="name">Lock during fajr</div>
    <div class="hint">Disable to skip the dawn window</div>
  </div>
  <div class="switch on"></div>
</div>
<div class="toggle-row">
  <div class="body">
    <div class="name">Strict mode</div>
    <div class="hint">No bypass during salah</div>
  </div>
  <div class="switch"></div>
</div>
</body></html>
