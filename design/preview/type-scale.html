<!doctype html>
<html><head><meta charset="utf-8"><title>Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .wrap{padding:24px 32px;display:grid;grid-template-columns:90px 1fr;gap:10px 18px;align-items:baseline;}
  .tag{font-family:var(--font-sans);font-size:11px;color:var(--fg-2);letter-spacing:0.06em;text-transform:uppercase;}
  .h1{font-family:var(--font-serif);font-size:31px;font-weight:700;line-height:37px;color:var(--fg-1);}
  .h2{font-family:var(--font-serif);font-size:24px;font-weight:700;line-height:30px;color:var(--fg-1);}
  .h3{font-family:var(--font-sans);font-size:20px;font-weight:600;line-height:24px;color:var(--fg-1);}
  .lg{font-family:var(--font-sans);font-size:18px;line-height:26px;color:var(--fg-1);}
</style></head>
<body><div class="wrap">
  <div class="tag">H1 · Serif</div><div class="h1">Begin your day with prayer</div>
  <div class="tag">H2 · Serif</div><div class="h2">A path of small, certain steps</div>
  <div class="tag">H3 · Sans</div><div class="h3">Maghrib · 5:42 pm</div>
  <div class="tag">Body LG</div><div class="lg">Inter at 18 / 26 carries supportive copy with quiet confidence.</div>
</div></body></html>
