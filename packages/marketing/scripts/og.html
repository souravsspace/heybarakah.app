<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Libre Baskerville";
        font-weight: 700;
        src: url("../public/fonts/LibreBaskerville-Bold.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-weight: 100 900;
        src: url("../public/fonts/Inter-VariableFont_opsz_wght.woff2") format("woff2");
      }

      :root {
        --green: #29603e;
        --green-deep: #1b3f29;
        --green-press: #173621;
        --cream: #f5ebdb;
        --paper: #faf4e8;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(
            120% 140% at 72% 38%,
            #2f6b46 0%,
            var(--green) 38%,
            var(--green-deep) 78%,
            var(--green-press) 100%
          );
        font-family: "Inter", sans-serif;
        color: var(--cream);
      }

      /* hairline manuscript frame */
      .frame {
        position: absolute;
        inset: 36px;
        border: 1px solid rgba(245, 235, 219, 0.32);
      }
      .frame::after {
        content: "";
        position: absolute;
        inset: 7px;
        border: 1px solid rgba(245, 235, 219, 0.16);
      }

      /* corner stars on the frame */
      .corner {
        position: absolute;
        width: 26px;
        height: 26px;
        opacity: 0.7;
      }
      .corner.tl { top: 23px; left: 23px; }
      .corner.tr { top: 23px; right: 23px; }
      .corner.bl { bottom: 23px; left: 23px; }
      .corner.br { bottom: 23px; right: 23px; }

      /* big geometric watermark behind the medallion */
      .watermark {
        position: absolute;
        top: 50%;
        right: 96px;
        transform: translateY(-50%);
        width: 560px;
        height: 560px;
        opacity: 0.5;
      }

      .content {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        padding: 0 96px;
      }

      .left {
        flex: 1;
        z-index: 2;
      }

      .overline {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: rgba(245, 235, 219, 0.66);
        margin-bottom: 26px;
      }

      .wordmark {
        font-family: "Libre Baskerville", serif;
        font-weight: 700;
        font-size: 138px;
        line-height: 0.98;
        letter-spacing: -0.01em;
        color: #fdfaf3;
      }

      .tagline {
        margin-top: 24px;
        font-size: 33px;
        font-weight: 400;
        line-height: 1.32;
        color: rgba(245, 235, 219, 0.9);
        max-width: 560px;
      }

      .rule {
        margin: 38px 0 26px;
        width: 132px;
        height: 1px;
        background: rgba(245, 235, 219, 0.4);
      }

      .prayers {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 21px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: rgba(245, 235, 219, 0.74);
      }
      .prayers .dot {
        width: 4px;
        height: 4px;
        border-radius: 999px;
        background: rgba(245, 235, 219, 0.45);
      }

      /* medallion + mark */
      .right {
        position: relative;
        width: 420px;
        height: 420px;
        flex: 0 0 420px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
      }
      .ring {
        position: absolute;
        inset: 0;
      }
      .mark {
        position: relative;
        height: 252px;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="frame"></div>

      <!-- Rub el Hizb (8-point star) corner ornaments -->
      <svg class="corner tl" viewBox="0 0 100 100"><g fill="none" stroke="#f5ebdb" stroke-width="4"><rect x="18" y="18" width="64" height="64"/><rect x="18" y="18" width="64" height="64" transform="rotate(45 50 50)"/></g></svg>
      <svg class="corner tr" viewBox="0 0 100 100"><g fill="none" stroke="#f5ebdb" stroke-width="4"><rect x="18" y="18" width="64" height="64"/><rect x="18" y="18" width="64" height="64" transform="rotate(45 50 50)"/></g></svg>
      <svg class="corner bl" viewBox="0 0 100 100"><g fill="none" stroke="#f5ebdb" stroke-width="4"><rect x="18" y="18" width="64" height="64"/><rect x="18" y="18" width="64" height="64" transform="rotate(45 50 50)"/></g></svg>
      <svg class="corner br" viewBox="0 0 100 100"><g fill="none" stroke="#f5ebdb" stroke-width="4"><rect x="18" y="18" width="64" height="64"/><rect x="18" y="18" width="64" height="64" transform="rotate(45 50 50)"/></g></svg>

      <!-- layered geometric watermark -->
      <svg class="watermark" viewBox="0 0 100 100">
        <g fill="none" stroke="#f5ebdb" stroke-width="0.5" opacity="0.55">
          <circle cx="50" cy="50" r="48" />
          <circle cx="50" cy="50" r="40" />
          <rect x="14" y="14" width="72" height="72" />
          <rect x="14" y="14" width="72" height="72" transform="rotate(45 50 50)" />
          <rect x="22" y="22" width="56" height="56" />
          <rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)" />
        </g>
      </svg>

      <div class="content">
        <div class="left">
          <div class="overline">Five prayers &middot; one quiet pause</div>
          <div class="wordmark">Barakah</div>
          <div class="tagline">Your phone steps aside for salah.<br />Show up — not scroll.</div>
          <div class="rule"></div>
          <div class="prayers">
            <span>Fajr</span><span class="dot"></span>
            <span>Dhuhr</span><span class="dot"></span>
            <span>Asr</span><span class="dot"></span>
            <span>Maghrib</span><span class="dot"></span>
            <span>Isha</span>
          </div>
        </div>

        <div class="right">
          <!-- medallion ring: 8-point star seal -->
          <svg class="ring" viewBox="0 0 100 100">
            <defs>
              <radialGradient id="seal" cx="50%" cy="42%" r="60%">
                <stop offset="0%" stop-color="#327150" />
                <stop offset="100%" stop-color="#1b3f29" />
              </radialGradient>
            </defs>
            <circle cx="50" cy="50" r="46" fill="url(#seal)" stroke="rgba(245,235,219,0.5)" stroke-width="0.5" />
            <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(245,235,219,0.28)" stroke-width="0.5" />
            <g fill="none" stroke="rgba(245,235,219,0.55)" stroke-width="0.6">
              <rect x="16" y="16" width="68" height="68" transform="rotate(0 50 50)" />
              <rect x="16" y="16" width="68" height="68" transform="rotate(45 50 50)" />
            </g>
          </svg>

          <!-- Barakah calligraphic mark (from app/navbar icon) -->
          <svg class="mark" viewBox="0 0 301 488" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="markFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="55%" stop-color="#f5ebdb" />
                <stop offset="100%" stop-color="#e6d8bf" />
              </linearGradient>
            </defs>
            <g fill="url(#markFill)">
              <path d="M20.1605 485.23C19.8705 483.25 19.3505 476.95 18.9905 471.31C16.6505 432.2 28.5805 402.32 58.2505 373.53C79.4905 352.95 100.66 339.84 154.12 314.35C174.92 304.46 190.45 296.33 202.09 289.3C207.95 285.71 209.12 285.27 209.49 286.3C210.66 289.3 211.83 307.91 211.83 322.63C211.9 366.14 201.65 403.86 180.56 438.35C173.53 449.78 166.13 459.22 155.58 470.06C145.62 480.39 134.71 489.91 135.8 487.42C144.66 466.55 151.84 436.74 154.48 410.22C155.73 397.33 155.14 366.57 153.53 365.03C153.02 364.44 118.15 379.82 104.31 386.71C76.7005 400.48 59.4105 412.93 46.5205 428.46C32.9705 444.72 25.2805 461.13 22.1305 480.46C20.7405 488.81 20.7405 488.88 20.1505 485.22L20.1605 485.23Z" />
              <path d="M0.310503 424.44C-2.5495 369.14 14.3005 325.49 52.8205 288.21C77.8705 263.97 102.041 249.17 161.071 221.93C185.171 210.8 194.831 205.96 207.291 198.79C240.251 179.97 261.711 161.66 276.581 139.76C285.741 126.28 292.551 110.54 294.451 98.16C295.481 91.35 295.621 90.84 296.501 90.84C298.331 90.84 300.531 113.25 299.941 125.63C298.041 165.33 283.24 196.75 252.55 226.78C231.46 247.43 201.65 265.23 148.62 288.96C105.85 308.08 80.9405 322.14 58.4605 339.86C48.8705 347.48 34.7305 361.69 28.3605 370.18C16.5705 385.93 7.3405 406.22 2.8705 426.28L0.890505 435.44L0.300509 424.45L0.310503 424.44Z" />
              <path d="M132.141 209.99C131.551 208.38 129.581 196.73 128.481 188.24C126.871 176.37 126.211 148.98 127.311 137.26C128.411 125.39 130.461 113.75 133.241 102.91C139.831 77.2 155.361 48.05 174.551 25.27C182.311 16.11 198.651 0 200.261 0H201.801L200.481 6.45C196.451 26.45 197.111 48.2 202.381 71.42C204.941 82.55 206.991 89.36 213.441 108.04C219.151 124.52 225.671 145.83 225.161 146.35C224.061 147.45 206.411 132.65 201.141 126.21C196.531 120.57 190.301 110.83 187.081 104.16C185.621 101.23 184.441 99.62 183.641 99.62C182.471 99.62 182.321 100.72 182.321 111.92C182.321 130.52 184.441 149.86 188.841 171.61C191.181 183.18 191.481 182.16 184.591 186.4C173.971 192.77 132.591 211.38 132.151 209.98L132.141 209.99Z" />
            </g>
          </svg>
        </div>
      </div>
    </div>
  </body>
</html>
