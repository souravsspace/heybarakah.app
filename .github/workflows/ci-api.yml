name: CI · api

on:
  pull_request:
    paths:
      - "packages/api/**"
      - "packages/core/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/ci-api.yml"

permissions:
  contents: read

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun turbo typecheck --filter=@barakah/api

      - name: Test (vitest workers pool)
        run: bun turbo test --filter=@barakah/api
